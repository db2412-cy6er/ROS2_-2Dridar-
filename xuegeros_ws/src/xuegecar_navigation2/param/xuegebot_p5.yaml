# ============================================================================
# xuegebot_p5.yaml — P5 安全版 Nav2 参数（P1/Nav2 原文件 xuegebot.yaml 未改动）
#
# 用法：
#   ros2 launch xuegecar_navigation2 navigation2_rviz.launch.py \
#     map:=/home/chuyun/xuegeros_ws/maps/p1_cartographer_room.yaml \
#     params_file:=<install>/share/xuegecar_navigation2/param/xuegebot_p5.yaml
#
# 与 xuegebot.yaml 的差异（理由见 P5 报告"避障与安全设计"）：
#   robot_radius     0.10  -> 0.17   物理外接半径 0.12（URDF 轮缘 0.10+0.02）+ 5cm 余量
#   inflation_radius 0.20  -> 0.30   软偏置区，需 > robot_radius
#   xy_goal_tol      0.25  -> 0.05   精确停点（配合 P5 goal_offset 0.30/0.28）
#   yaw_goal_tol     0.25  -> 0.15
#   max_vel_x/xy     0.30  -> 0.05   5cm/s 慢速精确移动（用户要求）
#   acc/decel_lim_x  1.0/-2.5 -> 0.2/-0.3   慢速下不允许冲出去
#   max_vel_theta    1.2   -> 0.6
#   trans_stopped_velocity 0.25 -> 0.02     必须 < max_vel_x
#   required_movement_radius 0.5 -> 0.05    5cm/s 下 10s 只走 0.5m，否则判"卡住"
#   movement_time_allowance 10 -> 30
#   allow_unknown    true  -> false  禁止穿越未知区域（防撞墙）
#   BaseObstacle.scale 0.02 -> 0.10  强化 DWB 避障批评项（默认值太弱）
#
# 5cm/s 慢速必须成组修改（否则一定跑不动）：
#   * AMCL update_min_d/a 0.25/0.2 -> 0.02/0.03（慢速下 5 秒才校正一次位姿）
#   * progress_checker 0.3/10s -> 0.05/30s（否则慢速被判"卡住"而中止）
#   * trans_stopped_velocity 必须远小于 max_vel_x
#   * velocity_smoother 段显式声明 max_velocity 0.05
#
# 地图不再"越跑越乱"的两处改动：
#   * local_costmap 去掉 static_layer/voxel_layer（rolling 窗口里的静态地图副本
#     会随车滑动，RViz 上就是"地图重叠"）
#   * global_costmap raytrace_max_range 3.0 -> 2.5（与 obstacle_max_range 取齐，
#     消除超过 3m 就永远清不掉的"幽灵墙"）
#
# 注意：本文件里 use_sim_time 仍为 True，但 nav2_bringup 会用 launch 参数
# 重写为 false（真机无 /clock）。启动后用
#   ros2 param get /controller_server use_sim_time
# 确认为 False。
# ============================================================================

amcl:
  ros__parameters:
    use_sim_time: True
    alpha1: 0.3
    alpha2: 0.3
    alpha3: 0.3
    alpha4: 0.3
    alpha5: 0.3
    base_frame_id: "base_link"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: true
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 12.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 90
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    # 5cm/s 慢速：走 2cm / 转 1.7° 就校正一次位姿（旧值 0.25/0.2 会让
    # 慢速时每 5 秒才校正一次，中间全靠里程计外推 -> 语义定位全歪）
    update_min_a: 0.03
    update_min_d: 0.02
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan

amcl_map_client:
  ros__parameters:
    use_sim_time: True

amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: True

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.
    plugin_lib_names:
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_compute_path_through_poses_action_bt_node
    - nav2_smooth_path_action_bt_node
    - nav2_follow_path_action_bt_node
    - nav2_spin_action_bt_node
    - nav2_wait_action_bt_node
    - nav2_back_up_action_bt_node
    - nav2_drive_on_heading_bt_node
    - nav2_clear_costmap_service_bt_node
    - nav2_is_stuck_condition_bt_node
    - nav2_goal_reached_condition_bt_node
    - nav2_goal_updated_condition_bt_node
    - nav2_globally_updated_goal_condition_bt_node
    - nav2_is_path_valid_condition_bt_node
    - nav2_initial_pose_received_condition_bt_node
    - nav2_reinitialize_global_localization_service_bt_node
    - nav2_rate_controller_bt_node
    - nav2_distance_controller_bt_node
    - nav2_speed_controller_bt_node
    - nav2_truncate_path_action_bt_node
    - nav2_truncate_path_local_action_bt_node
    - nav2_goal_updater_node_bt_node
    - nav2_recovery_node_bt_node
    - nav2_pipeline_sequence_bt_node
    - nav2_round_robin_node_bt_node
    - nav2_transform_available_condition_bt_node
    - nav2_time_expired_condition_bt_node
    - nav2_path_expiring_timer_condition
    - nav2_distance_traveled_condition_bt_node
    - nav2_single_trigger_bt_node
    - nav2_is_battery_low_condition_bt_node
    - nav2_navigate_through_poses_action_bt_node
    - nav2_navigate_to_pose_action_bt_node
    - nav2_remove_passed_goals_action_bt_node
    - nav2_planner_selector_bt_node
    - nav2_controller_selector_bt_node
    - nav2_goal_checker_selector_bt_node
    - nav2_controller_cancel_bt_node
    - nav2_path_longer_on_approach_bt_node
    - nav2_wait_cancel_bt_node
    - nav2_spin_cancel_bt_node
    - nav2_back_up_cancel_bt_node
    - nav2_drive_on_heading_cancel_bt_node

bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: True

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    # 5cm/s 下 10s 只能走 0.5m：阈值必须 < 0.05m 且时限要放宽，
    # 否则慢速会被判成"卡住"而中止（旧值 0.3m/10s 是给 0.2m/s 用的）
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.05
      movement_time_allowance: 30.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.05
      yaw_goal_tolerance: 0.15
    # DWB parameters
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      min_vel_x: -0.05
      min_vel_y: 0.0
      max_vel_x: 0.05
      max_vel_y: 0.0
      max_vel_theta: 0.6
      min_speed_xy: 0.0
      max_speed_xy: 0.05
      min_speed_theta: 0.0
      # Add high threshold velocity for turtlebot 3 issue.
      # https://github.com/ROBOTIS-GIT/turtlebot3_simulations/issues/75
      acc_lim_x: 0.2
      acc_lim_y: 0.0
      acc_lim_theta: 1.0
      decel_lim_x: -0.3
      decel_lim_y: 0.0
      decel_lim_theta: -1.5
      vx_samples: 20
      vy_samples: 5
      vtheta_samples: 40
      sim_time: 4.0
      linear_granularity: 0.01
      angular_granularity: 0.02
      transform_tolerance: 0.5
      xy_goal_tolerance: 0.05
      # 必须远小于 max_vel_x，否则 RotateToGoal 永远认为"已停住"
      trans_stopped_velocity: 0.02
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.1
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: True

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: True
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      robot_radius: 0.17
      # 只保留"实时障碍 + 膨胀"：local_costmap 是 rolling(odom) 窗口，
      # 一旦挂上 static_layer，就会把自己的那块静态地图在 odom 系里再画一遍，
      # 车一动它相对全局地图滑动 —— RViz 里看到的就是"地图重叠、越来越乱"。
      # 全局静态地图由 global_costmap 的 static_layer 负责，DWB 只需要近处障碍。
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.0
        inflation_radius: 0.3
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      always_send_full_costmap: True
  local_costmap_client:
    ros__parameters:
      use_sim_time: True
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: True
      robot_radius: 0.17
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          # 与 obstacle_max_range 取齐：超过该距离的旧标记永远清不掉，
          # 位姿有几厘米误差就会在静态地图墙旁边留下"幽灵墙"，越跑越花
          raytrace_max_range: 2.5
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.0
        inflation_radius: 0.3
      always_send_full_costmap: True
  global_costmap_client:
    ros__parameters:
      use_sim_time: True
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: True

map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: "turtlebot3_world.yaml"

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: false

planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: True

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    use_sim_time: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.5
    min_rotational_vel: 0.15
    rotational_acc_lim: 1.5

robot_state_publisher:
  ros__parameters:
    use_sim_time: True

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

# ---------------------------------------------------------------------------
# 速度平滑器：显式声明 5cm/s 上限。不写这一段会落到默认 0.26 m/s，
# 虽然它只是上游限幅（不会放大 DWB 的 0.05），但显式写出来才能保证
# 整条链路（DWB -> smoother -> /cmd_vel）都是慢速档。
# ---------------------------------------------------------------------------
velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.05, 0.0, 0.6]
    min_velocity: [-0.05, 0.0, -0.6]
    max_accel: [0.2, 0.0, 1.0]
    max_decel: [-0.3, 0.0, -1.5]
    odom_topic: "/odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
